cv:
  name: Wout Goesaert
  label: Astronomy PhD Candidate at Leiden University
  email: goesaert@strw.leidenuniv.nl
  website: https://woutgoesaert.github.io
  summary: >-
    PhD student at Leiden Observatory studying the evolved phases of stellar evolution
    (TP-AGB stars) in quiescent galaxies using near-infrared observations. Background in
    radio and infrared astronomy, with research experience spanning ALMA, JWST and MeerKAT.
    Enjoys giving talks, popular science writing, and stargazing with a Dobsonian telescope.

