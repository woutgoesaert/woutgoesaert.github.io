    Experience:
      - company: Leiden University
        position: "PhD Candidate — TP-AGB stars as actors of galaxy evolution"
        location: Leiden, The Netherlands
        start_date: 2025
        end_date: 2029
        summary: Supervisor Prof. Mariska K.T. Kriek

      - company: "ESO: Santiago de Chile"
        position: "Research Internship — ALMA: Resolving the torus and outflow of the Circinus AGN"
        location: Santiago, Chile
        start_date: 2024
        end_date: 2024
        summary: Supervisors Dr. Konrad R. W. Tristram and Dr. C. M. Violette Impellizzeri
        highlights:
          - Built on my first master's thesis with a focus on the outflows and inflows traced by the continuum and molecular kinematics.
          - Attempted to construct the first mass balance equation between a SMBH, torus, CND and galaxy.

      - company: Leiden University
        position: "Master Thesis — JWST: H3+ Absorption and Emission Seen by JWST Probes Extremely High Ionisation Rates in (U)LIRGs (grade 10/10)"
        location: Leiden, The Netherlands
        start_date: 2023
        end_date: 2024
        summary: Supervisors Prof. dr. P. P. van der Werf and V. A. Buiten MSc
        highlights:
          - Utilised JWST data to study H3+ in (U)LIRGs, leading to the discovery of H3+ emission in the ISM and the highest measured ionisation rates to date.

      - company: Leiden University
        position: "First Master Project — ALMA: A novel view on the Circinus torus and circumnuclear disk (grade 9.5/10)"
        location: Leiden, The Netherlands
        start_date: 2022
        end_date: 2023
        summary: Supervisors Dr. C. M. Violette Impellizzeri and Dr. Alex P. S. Hygate
        highlights:
          - Cleaned, self-calibrated and combined ALMA radio data.
          - First measurements of the (column) density and temperature in a torus (LTE + non-LTE).
          - Studied line ratios, continuum mechanism, morphology and kinematics at the highest spatial resolution to date.

      - company: Leiden University
        position: "Bachelor Thesis — MeerKAT: Polarimetry of Galaxy Cluster Magnetic Fields (grade 9/10)"
        location: Leiden, The Netherlands
        start_date: 2022
        end_date: 2022
        summary: Supervisors Dr. Reinout J. van Weeren and Dr. Erik Osinga
        highlights:
          - Mapped Faraday rotation of radio sources in Abell 85 using the MeerKAT Galaxy Cluster Legacy Survey.
          - Determined the feasibility and limits of using the MGCLS catalog for this purpose.

      - company: Leiden University
        position: "Experimental Project — Quantum Optics: Delayed Choice Quantum Eraser (grade 9.5/10)"
        location: Leiden, The Netherlands
        start_date: 2021
        end_date: 2022
        summary: Supervisors Dr. Wolfgang Löffler and Matteo Fisicaro MSc
        highlights:
          - Built a delayed choice quantum eraser by storing superposition in polarisation of entangled photons, in a team of seven.
          - Demonstrated Bell inequality for the first time in Leiden.
          - Took on both a scientific and managing role in the project.

      - company: Leiden University
        position: "First Author Publication — Fluid dynamics: Capillary waves on water jets"
        location: Leiden, The Netherlands
        start_date: 2020
        end_date: 2023
        summary: Co-author Dr. Ir. Paul Logman
        highlights:
          - Developed a new method to accurately measure the dispersion relation of capillary waves on water jets.
          - Constructed a semi-quantitative simulation for educational purposes.
          - Published in the American Journal of Physics.

